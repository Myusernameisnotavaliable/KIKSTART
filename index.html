<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#080d17">
<title>KIKSTART</title>
<style>
html,body{margin:0;min-height:100%;background:#080d17;color:#fff;font:15px system-ui;display:grid;place-items:center}
#status{padding:24px;text-align:center;color:#cbd5e1}
</style>
</head>
<body>
<div id="status">Loading KIKSTART v40.5…</div>
<script>
(async()=>{
 const status=document.getElementById('status');
 try{
  const parts=Array.from({length:15},(_,i)=>'site-v40.5-part-'+String(i+1).padStart(2,'0')+'.txt');
  const responses=await Promise.all(parts.map(url=>fetch(url,{cache:'no-store'})));
  const bad=responses.findIndex(r=>!r.ok);
  if(bad!==-1)throw new Error('Game source part '+(bad+1)+' could not be loaded (HTTP '+responses[bad].status+').');
  const source=(await Promise.all(responses.map(r=>r.text()))).join('\n');
  if(!source.includes("window.KIKSTART_GAME_VERSION='40.5'")||!source.trimEnd().endsWith('</html>'))throw new Error('The downloaded game source failed its version/integrity check.');
  document.open();document.write(source);document.close();
 }catch(e){status.textContent='KIKSTART could not load: '+e.message;console.error(e);}
})();
</script>
</body>
</html>
